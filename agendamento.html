<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento - Clínica Vida</title>
    <link rel="stylesheet" href="assets/css/site.css">
</head>

<body>

    <header>
        <h1>Clínica Vida</h1>

        <nav>
            <a href="index.html">Início</a> |
            <a href="agendamento.html">Agendar consulta</a>
        </nav>
    </header>

    <main>
        <h2>Agendar consulta</h2>

        <form class="form-agendamento" action="/agendamento" method="post">

            <fieldset>
                <legend>Dados do paciente</legend>

                <div class="form-grid">

                    <div class="campo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" minlength="5" required>
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" required>
                    </div>

                    <div class="campo">
                        <label for="nascimento">Data de nascimento</label>
                        <input type="date" id="nascimento" name="nascimento" required>
                    </div>

                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="tel" id="telefone" name="telefone" required>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                </div>
            </fieldset>

            <fieldset>
                <legend>Dados da consulta</legend>

                <div class="form-grid">

                    <div class="campo">
                        <label for="especialidade">Especialidade</label>
                        <select id="especialidade" name="especialidade" required>
                            <option value="">Selecione</option>
                            <option value="clinico-geral">Clínico Geral</option>
                            <option value="cardiologia">Cardiologia</option>
                            <option value="dermatologia">Dermatologia</option>
                            <option value="pediatria">Pediatria</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="data">Data da consulta</label>
                        <input type="date" id="data" name="data" required>
                    </div>

                    <div class="campo">
                        <label for="horario">Horário</label>
                        <input type="time" id="horario" name="horario" required>
                    </div>

                    <div class="campo campo-largo">
                        <label for="observacoes">Observações</label>
                        <textarea id="observacoes" name="observacoes" rows="3" maxlength="300"></textarea>
                    </div>

                </div>
            </fieldset>

            <button type="submit">Agendar consulta</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Clínica Vida. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
